services:
  dq-file-donor:
    build:
      context: .
      dockerfile: Dockerfile
    image: dq-the-file-donor:latest
    container_name: dq-the-file-donor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata  # Adjust to your timezone
      
    # Uncomment if the bot needs to expose a port (e.g. webhook mode)
    ports:
       - "9595:9595"
    volumes:
      - .:/DQTheFileDonorBot
